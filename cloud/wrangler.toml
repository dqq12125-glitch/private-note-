# 回声岛公开版服务器（Cloudflare Workers + D1）。说明见 README.md，接口见 API.md。
# 秘密（DASHSCOPE_API_KEY、AUTH_PEPPER、ADMIN_TOKEN、RESEND_API_KEY、DATA_KEY、APPLE_SIGNIN_KEY）不写在这里：
#   npx wrangler secret put 名字
name = "echo-island-cloud"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# 一个请求（包括一整段 WebSocket 对话）最多用多少 CPU 毫秒。转发一段 10 分钟的语音聊天实测约 1 秒以内，这里给足
[limits]
cpu_ms = 60000

[[d1_databases]]
binding = "DB"
database_name = "echo-island"
database_id = "2243c92e-19cd-4a9a-a8aa-907f37a4f120"   # 2026-11-20 建在老板放收银系统的那个 Cloudflare 账号上（APAC）
migrations_dir = "migrations"

# 每天一次：删 90 天前的举报、过期的会话 / 登录码 / 同意链接 / 限流计数、40 天前的用量，结算断掉的聊天
[triggers]
crons = ["17 3 * * *"]

# 每分钟的限流（Cloudflare Rate Limiting 绑定；每个机房各算各的，是挡滥用的第一道。真正封顶的是 D1 里每天的用量）
# namespace_id 是自己随便定的整数，同一个账号里不重复就行
[[ratelimits]]
name = "RL_AI_USER"
namespace_id = "7101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_AI_IP"
namespace_id = "7102"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "RL_WS_USER"
namespace_id = "7103"
simple = { limit = 12, period = 60 }

[vars]
ENVIRONMENT = "production"
COMPANY_NAME = "Echo of Forest Pty Ltd"
# 公开地址（家长同意邮件里的链接用）：换成真的域名，例如 https://api.example.com
PUBLIC_URL = "https://echo-island-cloud.dqq12125-study.workers.dev"
PRIVACY_URL = ""
# App 的 Bundle ID（Sign in with Apple 的 aud、App Store 交易的 bundleId）——和 App Store Connect 里的一样
APPLE_BUNDLE_ID = "com.echoisland.app"
# 订阅的产品 id → 档位。产品 id 是在 App Store Connect 里建订阅时自己起的名字
APPLE_PRODUCTS = '{"com.echoisland.app.premium.monthly":"monthly","com.echoisland.app.premium.yearly":"yearly"}'
# 认哪些环境的交易：App 审核和 TestFlight 用 Sandbox，所以正式服务器也要认 Sandbox
APPLE_ENVIRONMENTS = "Production,Sandbox"
# Sign in with Apple 撤销用（删号时）：Team ID 和 Key ID；钥匙本身是秘密 APPLE_SIGNIN_KEY
APPLE_TEAM_ID = "8DC33LZZ4G"
APPLE_SIGNIN_KEY_ID = ""
# 邮件：resend（正式）/ console（只打印到日志，本机开发用）
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "Echo Island <hello@restaurantweb.com.au>"
# 每天的额度（分钟、次数）：改这里就行，不用改代码
PLANS = '{"free":{"talkMin":5,"asrN":400,"auxN":300},"monthly":{"talkMin":30,"asrN":1500,"auxN":1500},"yearly":{"talkMin":20,"asrN":1500,"auxN":1500}}'
# 阿里云百炼。老板 2026-11-20 定：先用现有那把钥匙（北京区）把流程跑通；正式对外发之前换成国际版（新加坡）：
#   DS_HTTP_BASE = "https://dashscope-intl.aliyuncs.com"、DS_WS_BASE = "wss://dashscope-intl.aliyuncs.com"，模型名对着控制台核对（README「阿里云」一节）
DS_HTTP_BASE = "https://dashscope.aliyuncs.com"
DS_WS_BASE = "wss://dashscope.aliyuncs.com"
TALK_MODEL = "qwen3.8-omni-flash-realtime"
TALK_ASR_MODEL = "qwen3-asr-flash-realtime"
ASR_RT_MODEL = "qwen3-asr-flash-realtime"
ASR_MODEL = "qwen3-asr-flash"
EVAL_MODEL = "qwen-plus"
TTS_MODEL = "qwen3-tts-flash"
# 孩子年龄段是 child、还没得到家长同意时不能用的功能
CONSENT_GATED = "talk,place,steps"
ALLOWED_ORIGINS = "echoisland://localhost,https://appassets.androidplatform.net"
TALK_SESSION_MAX_SEC = "600"
TALK_WARN_SEC = "60"
