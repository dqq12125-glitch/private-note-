<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>原生桥自测</title>
<!--
  回声岛 iPhone 版 · 原生桥自测页（只打进调试包：ios/project.yml 的 Release 不带 www-test，原生那边正式包也不认 /__test/ 这个路径）。
  打开方式：调试包带启动参数 -EchoSelfTest all|mic|share|pick|store（ios/UITests 就是这样开的），地址是 echoisland://localhost/__test/selftest.html?run=…
  run=all   ：把 window.EchoNative 的每个方法都调一遍（android/README.md 的 26 个），再看几样 WebKit 的本事（安全来源、Range、配音、类型）。
              不会真的连 AI：只在「没有密钥」时测连阿里云的两个方法（原生当场回 401，不出网）；有密钥时跳过。
              会改手机上状态的几样都先看一眼再做：没有密钥才测 setKey（设了再清掉），销售版还没设家长密码才测 setPin，今天还没有备份才测 backupWrite。
              不自动调 openAppSettings（会离开 App）、backupPick、分享（会弹界面）：这三个由下面的 run=mic / share / pick 和按钮来测。
  run=mic   ：要一次麦克风（第一次会弹系统的「允许使用麦克风」，UI 测试去点「允许」），记下结果和 micPermission()。
  run=share ：shareFile 弹分享面板；run=pick：backupPick 弹文件选择器。弹没弹出来由原生的状态行（UI 测试读）判断。
  run=store ：订阅：问一次商品（iapProducts）；有商品就开始买第一个（弹购买面板，UI 测试看它弹没弹出来，不点）。
              云上的模拟器没有本地 App Store（xcodebuild test 不把 Store.storekit 交给模拟器），多半一个商品都没有，只记下来。
  iPhone 才有的 13 个（订阅、通过 Apple 登录、口语题的本机识别）在 run=all 里只测「当场回」的几样（参数不对、这个包没有登录权限）和不弹界面的几样；
  iapRestore（可能要输 Apple 账户密码）、iapManage、真的 appleSignIn 只有按钮。
  本机识别：speechState 一定要回、形状对；speechStart 带 ask:false（不弹权限框），模拟器多半回 unavailable（没有本机识别）/ not-asked（还没问过权限），
  也算过——要证明的只是桥通、这几种情况网页认得；speechFeed 对着没在听的编号送一段（原生不管、不回话、不崩）；
  万一真的开起来了，送 3 段静音（speechFeed），马上 speechStop，要收到事件 echo-speech 的 end，fed 是 3。
  run=packs ：课程包（tools/pack/SPEC.md §6）。① echoisland:// 这个来源能用 IndexedDB 存一个 ArrayBuffer、读回来一样，并留一个记号给下一次；
              ② 用游戏的 packs.js 从 www-test/packs/（tools/pack/build.js --only 打的小样）装一遍英语（地址换成 /__test/packs）：
              下完、每一段都在；③ 装好的第一段在 WKWebView 里放得出声：blob: 地址给 <audio>，play() 不报错、ended 来了。
  run=packs2：UI 测试把 App 关掉再开（-EchoSelfTest packs2）：①的记号和 ArrayBuffer 还在；英语还是装好的（不联网也认得），那一段照样放得出声。
              最后删掉小样（别让同一个调试包里的游戏以为英语装好了）。
  结果：window.__echoTestResult = { run, done, pass, fail, warn, skip, items: [{ name, ok, got, note }], mic, ui, store, packs }
        ok：true 过了 / false 没过（UI 测试判失败）/ 'warn' 看情况（和模拟器、系统版本有关的，只记下来）/ 'skip' 没测（写着为什么）
-->
<style>
  body { margin: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
    font: 14px/1.4 -apple-system, "PingFang SC", sans-serif; background: #12304a; color: #fff; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  #sum { font-weight: 700; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 0; background: #ffc53d; color: #12304a; font-weight: 700; }
  ol { padding-left: 22px; }
  li { margin: 2px 0; word-break: break-all; }
  .ok { color: #9be7a4; } .bad { color: #ff8a80; } .warn { color: #ffe082; } .skip { color: #b0bec5; }
</style>
</head>
<body>
<h1>原生桥自测</h1>
<p id="sum">还在跑……</p>
<div class="btns">
  <button id="b-mic" aria-label="selftest-mic">🎤 要麦克风</button>
  <button id="b-share" aria-label="selftest-share">📤 分享一个文件</button>
  <button id="b-pick" aria-label="selftest-pick">📂 选一个文件</button>
  <button id="b-settings" aria-label="selftest-settings">⚙️ 去设置</button>
  <button id="b-products" aria-label="selftest-products">🛒 商品</button>
  <button id="b-restore" aria-label="selftest-restore">♻️ 恢复购买</button>
  <button id="b-manage" aria-label="selftest-manage">🧾 管理订阅</button>
  <button id="b-apple" aria-label="selftest-apple">🔑 通过 Apple 登录</button>
</div>
<ol id="list"></ol>
<script>
(function () {
  'use strict';
  var run = (new URLSearchParams(location.search).get('run') || 'all').toLowerCase();
  var R = window.__echoTestResult = { run: run, done: false, pass: 0, fail: 0, warn: 0, skip: 0, items: [], mic: null, ui: {}, store: null };
  var N = window.EchoNative;
  var list = document.getElementById('list'), sum = document.getElementById('sum');

  // 和 android/README.md、tests/native.test.js 一样的方法表：名字 → [同步 / 异步, 参数个数]
  var WANT = {
    hasKey: ['sync', 0], setKey: ['sync', 1], wsOpen: ['async', 2], wsSend: ['async', 2], wsClose: ['async', 1], post: ['async', 3],
    setOrientation: ['sync', 1], version: ['sync', 0], diag: ['sync', 0], takeRecovered: ['sync', 0], edition: ['sync', 0], books: ['sync', 0],
    verUrl: ['sync', 0], storage: ['sync', 0], hasPin: ['sync', 0], checkPin: ['sync', 1], pinStatus: ['sync', 0], setPin: ['sync', 1],
    micPermission: ['sync', 0], openAppSettings: ['sync', 0], backupWrite: ['sync', 1], backupList: ['sync', 0], backupRead: ['sync', 1],
    backupPick: ['sync', 0], shareText: ['sync', 2], shareFile: ['sync', 3],
    // iPhone 才有的（tests/ios.test.js 的 IOS_ONLY）：订阅、通过 Apple 登录
    iapProducts: ['async', 2], iapBuy: ['async', 3], iapRestore: ['async', 1], iapCurrent: ['async', 1], iapPending: ['async', 1],
    iapFinish: ['async', 2], iapManage: ['async', 1], appleSignIn: ['async', 2], appleCredentialState: ['async', 2],
    // 口语题的本机识别（LocalSpeech.swift；声音由网页 speechFeed 送过去）
    speechState: ['async', 1], speechStart: ['async', 2], speechFeed: ['async', 2], speechStop: ['async', 1]
  };
  var IOS_ONLY = ['iapProducts', 'iapBuy', 'iapRestore', 'iapCurrent', 'iapPending', 'iapFinish', 'iapManage', 'appleSignIn', 'appleCredentialState', 'speechState', 'speechStart', 'speechFeed', 'speechStop'];

  function show(t) { try { return typeof t === 'string' ? t.slice(0, 140) : JSON.stringify(t).slice(0, 140); } catch (e) { return String(t); } }
  function add(name, ok, got, note) {
    var it = { name: name, ok: ok, got: got === undefined ? '' : show(got), note: note || '' };
    R.items.push(it);
    if (ok === true) R.pass++; else if (ok === false) R.fail++; else if (ok === 'warn') R.warn++; else R.skip++;
    var li = document.createElement('li');
    li.className = ok === true ? 'ok' : ok === false ? 'bad' : ok === 'warn' ? 'warn' : 'skip';
    li.textContent = (ok === true ? '✓ ' : ok === false ? '✗ ' : ok === 'warn' ? '⚠ ' : '– ') + name + (it.got ? ' → ' + it.got : '') + (it.note ? '（' + it.note + '）' : '');
    list.appendChild(li);
    sum.textContent = '过了 ' + R.pass + '，没过 ' + R.fail + '，看情况 ' + R.warn + '，没测 ' + R.skip + (R.done ? '' : ' ……');
  }
  function check(name, fn, note) {
    try { var v = fn(); add(name, !!v.ok, v.got, v.note || note); } catch (e) { add(name, false, 'threw ' + (e && e.message), note); }
  }
  function J(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function today() { var d = new Date(); return '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }

  // 原生的异步回调：window.__echoNative(id, 类型, 数据)
  var waiters = {}, nextId = 900;
  window.__echoNative = function (id, type, data) { var w = waiters[id]; if (w) { delete waiters[id]; w({ type: type, data: data }); } };
  function nativeCall(fn, ms) {
    var id = ++nextId;
    return new Promise(function (res) {
      waiters[id] = res;
      setTimeout(function () { if (waiters[id]) { delete waiters[id]; res({ type: 'timeout', data: '' }); } }, ms || 4000);
      try { fn(id); } catch (e) { delete waiters[id]; res({ type: 'threw', data: String(e && e.message) }); }
    });
  }

  function finish() {
    R.done = true;
    sum.textContent = (R.fail ? '✗ ' : '✓ ') + '过了 ' + R.pass + '，没过 ' + R.fail + '，看情况 ' + R.warn + '，没测 ' + R.skip;
  }

  // ---------- 一、环境：安全来源、桥在不在、自己的网站回得对不对 ----------
  async function env() {
    check('env.secureContext', function () { return { ok: window.isSecureContext === true, got: window.isSecureContext }; }, 'getUserMedia 要安全来源');
    check('env.flags', function () { return { ok: window.ECHO_APP === 1 && window.ECHO_IOS === 1 && !!N, got: { app: window.ECHO_APP, ios: window.ECHO_IOS, native: !!N } }; });
    check('env.methods', function () {
      var bad = Object.keys(WANT).filter(function (k) { return !N || typeof N[k] !== 'function' || N[k].length !== WANT[k][1]; });
      var extra = N ? Object.keys(N).filter(function (k) { return !(k in WANT); }) : [];
      return { ok: !bad.length && !extra.length, got: bad.length || extra.length ? { bad: bad, extra: extra } : Object.keys(WANT).length + ' 个都在、参数个数对' };
    });
    check('env.kinds', function () {
      var spec = (window.__echoIOS && window.__echoIOS.spec) || {};
      var bad = Object.keys(WANT).filter(function (k) { return !spec[k] || spec[k][0] !== WANT[k][0] || spec[k][1].length !== WANT[k][1]; });
      return { ok: !bad.length, got: bad.length ? bad : '同步 22 个 / 异步 4 个 + iPhone 才有的异步 ' + IOS_ONLY.length + ' 个' };
    });
    check('env.iosOnly', function () {
      var mine = ((window.__echoIOS && window.__echoIOS.iosOnly) || []).slice().sort().join(',');
      return { ok: mine === IOS_ONLY.slice().sort().join(','), got: mine || '(没有)' };
    });
    check('env.getUserMedia', function () { return { ok: !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function'), got: !!navigator.mediaDevices }; });
    // 页面换掉 window.prompt 也不影响桥（echo-native.js 先留了一份）
    check('env.promptSwap', function () {
      var real = window.prompt, ed;
      window.prompt = function () { return '"evil"'; };
      try { ed = N.edition(); } finally { window.prompt = real; }
      return { ok: ed === 'sales' || ed === 'family', got: ed };
    });
    try {
      // 课程包模式的包（打包时给了 ECHO_PACKS_URL）：配音不在包里（copy-web.mjs 不复制），Range 改拿课程包小样的配音包来试
      var packsMode = !!(window.__ECHO_BOOT && window.__ECHO_BOOT.packsUrl);
      var r = await fetch('/assets/voice/index.json');
      var ct = r.headers.get('content-type') || '', j = r.ok ? await r.json() : null;
      var rr, buf, magic, ctype;
      if (packsMode) {
        add('assets.json', r.status === 404 ? 'skip' : false, { status: r.status }, '课程包模式：配音不在包里（要是 200，就是 copy-web.mjs 还把配音打进去了）');
        var pc = await (await fetch('/__test/packs/catalog.json')).json();
        rr = await fetch('/__test/packs/en/' + pc.packs.en.ver + '/voice-000.bin', { headers: { Range: 'bytes=0-15' } });
        buf = new Uint8Array(await rr.arrayBuffer());
        magic = String.fromCharCode(buf[0], buf[1], buf[2], buf[3]);
        ctype = /application\/octet-stream/.test(rr.headers.get('content-type') || '') && magic === 'EPK1';
      } else {
        add('assets.json', r.status === 200 && /application\/json/.test(ct) && !!j && Array.isArray(j.f), { status: r.status, type: ct, clips: j && j.f ? j.f.length : 0 });
        var clip = j && j.f && j.f[0] ? '/assets/voice/f/' + j.f[0] + '.ogg' : '';
        R.clip = clip;
        rr = await fetch(clip, { headers: { Range: 'bytes=0-15' } });
        buf = new Uint8Array(await rr.arrayBuffer());
        magic = String.fromCharCode(buf[0], buf[1], buf[2], buf[3]);
        ctype = magic === 'OggS' && /audio\/ogg/.test(rr.headers.get('content-type') || '');
      }
      add('assets.range', rr.status === 206 && /^bytes 0-15\/\d+$/.test(rr.headers.get('content-range') || '') && buf.length === 16 && ctype,
        { status: rr.status, range: rr.headers.get('content-range'), len: buf.length, magic: magic });
      var mon = await (await fetch('/assets/mon3d/index.json')).json();
      var g = await fetch('/assets/mon3d/' + mon[0] + '.glb');
      var gb = new Uint8Array(await g.arrayBuffer());
      add('assets.glb', g.status === 200 && (g.headers.get('content-type') || '') === 'model/gltf-binary' && String.fromCharCode(gb[0], gb[1], gb[2], gb[3]) === 'glTF', { status: g.status, type: g.headers.get('content-type') });
      var f = await fetch('/assets/fonts/nunito-latin-500-normal.woff2');
      add('assets.font', f.status === 200 && (f.headers.get('content-type') || '') === 'font/woff2', { status: f.status, type: f.headers.get('content-type') });
      var nf = await fetch('/assets/no-such-file.json');
      add('assets.404', nf.status === 404, nf.status);
      var esc = await fetch('/../Info.plist').catch(function () { return { status: 'blocked' }; });
      add('assets.noEscape', esc.status === 404 || esc.status === 'blocked', esc.status);
    } catch (e) { add('assets', false, 'threw ' + (e && e.message)); }
  }

  // ---------- 二、和系统版本 / 模拟器有关的（只记下来，不算没过） ----------
  async function media() {
    var c = '';
    try { c = new Audio().canPlayType('audio/ogg; codecs="opus"'); } catch (e) { c = 'threw'; }
    add('media.canPlayOggOpus', c ? true : 'warn', c || '(空)', 'iOS 18.4 起才放得了 Ogg 里的 Opus；game.js 的 OGG_OK 看的就是它');
    if (R.clip) await mediaClip();
    else add('media.audioElement', 'skip', '', '没有打包的配音（课程包模式）：run=packs 测课程包里的那段');
    var as = null; try { as = navigator.audioSession ? navigator.audioSession.type : null; } catch (e) { as = 'threw'; }
    add('media.audioSession', as ? true : 'warn', as || '没有 navigator.audioSession', 'echo-native.js 平时设成 playback（静音键不关声音）');
    var gl = null; try { gl = document.createElement('canvas').getContext('webgl2'); } catch (e) { gl = null; }
    add('media.webgl2', gl ? true : 'warn', gl ? gl.getParameter(gl.VERSION) : '没有', '模拟器的 WebGL2 和真机不一样');
  }
  async function mediaClip() {
    var a = new Audio(R.clip);
    var got = await new Promise(function (res) {
      var t = setTimeout(function () { res('timeout ' + a.readyState); }, 8000);
      a.addEventListener('loadedmetadata', function () { clearTimeout(t); res('loadedmetadata ' + a.duration.toFixed(2) + 's'); });
      a.addEventListener('error', function () { clearTimeout(t); res('error ' + (a.error && a.error.code)); });
      a.preload = 'auto'; a.load();
    });
    add('media.audioElement', /^loadedmetadata/.test(got) ? true : 'warn', got, '经过自己的地址 + Range 读配音');
    try {
      var C = window.AudioContext || window.webkitAudioContext, ctx = new C();
      var ab = await (await fetch(R.clip)).arrayBuffer();
      var dec = await new Promise(function (res) {
        var t = setTimeout(function () { res('timeout'); }, 8000);
        ctx.decodeAudioData(ab, function (b) { clearTimeout(t); res('ok ' + b.duration.toFixed(2) + 's ' + b.sampleRate + 'Hz'); }, function (e) { clearTimeout(t); res('error ' + (e && e.message)); });
      });
      add('media.decodeAudioData', /^ok/.test(dec) ? true : 'warn', dec + ' · ctx ' + ctx.sampleRate + 'Hz ' + ctx.state);
      ctx.close();
    } catch (e) { add('media.decodeAudioData', 'warn', 'threw ' + (e && e.message)); }
  }

  // ---------- 课程包（run=packs / packs2）：IndexedDB 存 ArrayBuffer、重开还在；从 www-test/packs 装一遍；装好的那段放得出声 ----------
  var PROBE_N = 4096;
  function probeBytes() { var a = new Uint8Array(PROBE_N); for (var i = 0; i < PROBE_N; i++) a[i] = (i * 37 + 11) & 255; return a; }
  function idb(fn) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('echo-selftest', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onerror = function () { rej(r.error); };
      r.onsuccess = function () { var d = r.result; Promise.resolve(fn(d)).then(function (v) { d.close(); res(v); }, function (e) { d.close(); rej(e); }); };
    });
  }
  function kv(d, mode, k, v) {
    return new Promise(function (res, rej) {
      var tx = d.transaction('kv', mode), st = tx.objectStore('kv'), q = mode === 'readonly' ? st.get(k) : st.put(v, k);
      tx.oncomplete = function () { res(q.result); }; tx.onerror = function () { rej(tx.error); };
    });
  }
  // 游戏的 packs.js，地址换成自测页的小样（__ECHO_BOOT.packsUrl 最先认；原生给的真地址先放一边）
  function loadPacks() {
    return new Promise(function (res, rej) {
      if (window.EchoPacks) { res(window.EchoPacks); return; }
      window.__ECHO_BOOT = Object.assign({}, window.__ECHO_BOOT || {}, { packsUrl: '/__test/packs' });
      var s = document.createElement('script');
      s.src = '/packs.js';
      s.onload = function () { res(window.EchoPacks); };
      s.onerror = function () { rej(new Error('packs.js 没加载出来')); };
      document.head.appendChild(s);
    });
  }
  // 放一段：blob: 地址给 <audio>，play() 不报错、ended 来了（15 秒）
  function playBlob(url) {
    return new Promise(function (res) {
      var a = new Audio(), out = { url: url.slice(0, 5), play: '', ended: false, t: 0 };
      var t = setTimeout(function () { out.t = a.currentTime; res(out); }, 15000);
      a.addEventListener('ended', function () { clearTimeout(t); out.ended = true; out.t = a.currentTime; res(out); });
      a.addEventListener('error', function () { clearTimeout(t); out.play = out.play || 'error ' + (a.error && a.error.code); res(out); });
      a.src = url;
      var p = a.play();
      if (p && p.then) p.then(function () { out.play = 'ok'; }, function (e) { out.play = 'rejected ' + (e && e.name); clearTimeout(t); res(out); });
      else out.play = 'no promise';
    });
  }
  async function packsPlay(P, label) {
    var first = null;
    try {
      var cat = await (await fetch('/__test/packs/catalog.json')).json();
      var man = await (await fetch('/__test/packs/en/' + cat.packs.en.ver + '/manifest.json')).json();
      var b = new Uint8Array(await (await fetch('/__test/packs/en/' + cat.packs.en.ver + '/' + man.files[0].name)).arrayBuffer());
      first = P._.readBundle(b).items[0];
      R.packs.n = man.files.reduce(function (s, f) { return s + f.n; }, 0);
    } catch (e) { add(label + '.fixture', false, 'threw ' + (e && e.message), '读不出小样的第一段'); return; }
    add(label + '.hasClip', P.hasClip(first[1], first[0]) === true, first);
    var url = await P.clip(first[1], first[0]);
    if (!url) { add(label + '.clip', false, url, '读不出这一段'); return; }
    add(label + '.clip', url.indexOf('blob:') === 0, url.slice(0, 5));
    var r = await playBlob(url);
    R.packs[label + 'Play'] = r;
    // 不报错、ended 来了 = 过；play() 没报错但 15 秒没等到 ended、也放到了一点：看情况（云上的 Mac 有没有声音输出）；报错 / 一点都没放：没过
    add(label + '.play', r.play === 'ok' && r.ended ? true : r.play === 'ok' && r.t > 0 ? 'warn' : false, r, '课程包里的那段在 WKWebView 里放得出声');
  }
  async function packs() {
    R.packs = {};
    try {
      await idb(function (d) { return kv(d, 'readwrite', 'probe', probeBytes().buffer).then(function () { return kv(d, 'readwrite', 'mark', Date.now()); }); });
      var back = await idb(function (d) { return kv(d, 'readonly', 'probe'); });
      var u = back instanceof ArrayBuffer ? new Uint8Array(back) : null, want = probeBytes();
      add('packs.idbArrayBuffer', !!u && u.length === PROBE_N && want.every(function (x, i) { return u[i] === x; }), u ? u.length + ' 字节' : String(back), 'echoisland:// 这个来源能用 IndexedDB 存 ArrayBuffer');
    } catch (e) { add('packs.idbArrayBuffer', false, 'threw ' + (e && e.message)); }

    } else add('setKey', 'skip', '', '已经有密钥：不碰');
    // 家长密码
    var st = J(N.pinStatus());

      check('setPin', function () {
        var a = N.setPin('2580'), h = N.hasPin(), w = N.checkPin('0000'), left = J(N.pinStatus()).triesLeft, c = N.checkPin('2580'), left2 = J(N.pinStatus()).triesLeft;
        var change = N.setPin('1357'), old = N.checkPin('2580'), now = N.checkPin('1357');
        return { ok: a === true && h === true && w === false && left === 4 && c === true && left2 === 5 && change === true && old === false && now === true,

    // 备份：今天还没有备份才测写（别把真的存档备份盖掉）

    check('backupRead(乱名字)', function () { var r = N.backupRead('../echo-save-20261007.json'); return { ok: r === '', got: r }; });
    var name = 'echo-save-' + today() + '.json';
    if (bl && !bl.some(function (b) { return b.name.indexOf('echo-save-' + today()) === 0; })) {

        return { ok: w === true && !!it && /^\d{4}-\d{2}-\d{2}$/.test(it.date) && it.size === 14 && it.time > 0 && back === '{"selftest":1}', got: { write: w, item: it, read: back } };

  // ---------- 五、iPhone 才有的：订阅、通过 Apple 登录（只测当场回的和不弹界面的） ----------
  function uuid() {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* 老系统 */ }
    var h = '0123456789abcdef', s = '';
    for (var i = 0; i < 32; i++) s += h[Math.floor(Math.random() * 16)];
    return s.slice(0, 8) + '-' + s.slice(8, 12) + '-4' + s.slice(13, 16) + '-a' + s.slice(17, 20) + '-' + s.slice(20);
  }
  function nonce() { var a = new Uint8Array(24); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  // 回了 fail 并且 error 是这个
  function failed(r, code) { var j = J(r.data); return r.type === 'fail' && !!j && j.error === code; }
  // 要问 App Store 的：回了就算过（ok 并且形状对），等不到只记下来（模拟器 / 网络的事），回的形状不对才算没过
  function storeAnswer(name, r, shapeOk, note) {
    var j = J(r.data);
    if (r.type === 'timeout') add(name, 'warn', r, note || '等了 10 秒没回：模拟器上 App Store 慢');
    else if (r.type === 'fail' && j && j.error) add(name, 'warn', j, note || 'App Store 回了错（模拟器里没有商品、没登录 Apple 账户）');
    else add(name, r.type === 'ok' && !!j && shapeOk(j), j || r, note);
  }
  async function account() {
    var d = J(N.diag()) || {};
    check('diag.appleSignIn', function () { return { ok: typeof d.appleSignIn === 'boolean', got: d.appleSignIn, note: '签名的正式包才是 true' }; });
    check('diag.iapProducts', function () { return { ok: Array.isArray(d.iapProducts) && d.iapProducts.length === 2 && d.iapProducts[0] !== d.iapProducts[1], got: d.iapProducts }; });
    var r = await nativeCall(function (id) { return N.iapBuy(id, 'com.echoisland.selftest', 'not-a-uuid'); });
    add('iapBuy(不是 UUID)', failed(r, 'bad-token'), r, '没有账号的 UUID 不买，当场回');
    r = await nativeCall(function (id) { return N.iapBuy(id, 'bad id', uuid()); });
    add('iapBuy(坏的商品编号)', failed(r, 'bad-product'), r);
    r = await nativeCall(function (id) { return N.iapFinish(id, 'abc'); });
    add('iapFinish(不是数字)', failed(r, 'bad-id'), r);
    r = await nativeCall(function (id) { return N.iapFinish(id, '1'); }, 10000);
    storeAnswer('iapFinish(没有这一笔)', r, function (j) { return j.finished === false; });
    r = await nativeCall(function (id) { return N.iapPending(id); }, 10000);
    storeAnswer('iapPending', r, function (j) { return Array.isArray(j.transactions); });
    r = await nativeCall(function (id) { return N.iapCurrent(id); }, 10000);
    storeAnswer('iapCurrent', r, function (j) { return Array.isArray(j.entitlements); });
    r = await nativeCall(function (id) { return N.iapProducts(id, ''); }, 10000);
    storeAnswer('iapProducts', r, function (j) { return Array.isArray(j.products) && Array.isArray(j.missing) && typeof j.canPay === 'boolean'; });
    var pj = J(r.data);
    if (pj && pj.products && !pj.products.length) add('iapProducts.count', 'warn', pj.missing, '一个商品都没有：没有本地 App Store、App Store Connect 里还没建（或者没签付费 App 协议）');
    r = await nativeCall(function (id) { return N.appleSignIn(id, ''); });
    add('appleSignIn(没有 nonce)', failed(r, 'bad-nonce'), r, '当场回，不弹面板');
    r = await nativeCall(function (id) { return N.appleCredentialState(id, ''); });
    add('appleCredentialState(没有 user)', failed(r, 'bad-user'), r);
    if (d.appleSignIn === false) {
      r = await nativeCall(function (id) { return N.appleSignIn(id, nonce()); });
      add('appleSignIn(这个包没有权限)', failed(r, 'unavailable') && /not available in this build/.test(r.data), r, '不签名的包：说清楚，不崩');
      r = await nativeCall(function (id) { return N.appleCredentialState(id, '000123.selftest'); });
      add('appleCredentialState(这个包没有权限)', failed(r, 'unavailable'), r);
    } else {
      add('appleSignIn(这个包没有权限)', 'skip', '', '这个包带了登录权限：按「通过 Apple 登录」试');
    }
    check('iapRestore / iapManage', function () { return { ok: typeof N.iapRestore === 'function' && typeof N.iapManage === 'function', got: '在', note: '会弹系统界面：按按钮试' }; });
  }

  // ---------- 六、口语题的本机识别（LocalSpeech.swift）：不弹权限框，只看桥通不通、回的话网页认不认得 ----------
  var SPEECH_FAIL = ['unavailable', 'not-asked', 'denied', 'restricted', 'busy', 'background'];
  var SILENCE = btoa(String.fromCharCode.apply(null, new Array(3200).fill(0)));   // 0.1 秒 16kHz 16 位的静音
  async function speech() {
    var r = await nativeCall(function (id) { return N.speechState(id); }, 6000);
    var st = J(r.data);
    add('speechState', r.type === 'ok' && !!st && ['authorized', 'notDetermined', 'denied', 'restricted'].indexOf(st.auth) >= 0 &&
      typeof st.onDevice === 'boolean' && typeof st.available === 'boolean' && st.locale === 'en-US' && typeof st.engine === 'string' && st.listening === false, st || r);
    add('speechState.onDevice', st && st.onDevice ? true : 'warn', st ? { onDevice: st.onDevice, available: st.available, auth: st.auth } : r, '模拟器多半没有本机识别；真 iPhone 上是 true');
    r = await nativeCall(function (id) { return N.speechStop(id); });
    var sp = J(r.data);
    add('speechStop(没在听)', r.type === 'ok' && !!sp && sp.stopped === false, sp || r);
    // 对着没在听的编号送一段：原生不管、不回话（回了反而不对）
    var fr = await nativeCall(function () { return N.speechFeed(424242, SILENCE); }, 600);
    add('speechFeed(没在听的编号)', fr.type === 'timeout', fr, '不回话、不崩');
    var events = [];
    var onEv = function (e) { events.push(e.detail); };
    window.addEventListener('echo-speech', onEv);
    var sid = nextId + 1;
    r = await nativeCall(function (id) { return N.speechStart(id, JSON.stringify({ short: true, ask: false, rate: 16000 })); }, 8000);
    var j = J(r.data);
    if (r.type === 'fail') {
      add('speechStart(不弹框)', !!j && SPEECH_FAIL.indexOf(j.error) >= 0 && typeof j.message === 'string', j || r, '回了网页认得的原因（unavailable 等）：网页会改走云端识别');
    } else if (r.type === 'ok') {
      add('speechStart(不弹框)', !!j && j.listening === true && j.sid === sid && typeof j.ms === 'number', j);
      for (var k = 0; k < 3; k++) { N.speechFeed(sid, SILENCE); await wait(100); }
      await wait(300);
      var s2 = await nativeCall(function (id) { return N.speechStop(id); });
      await wait(300);
      var end = events.filter(function (e) { return e && e.sid === sid && e.kind === 'end'; })[0];
      // 静音可能让识别自己报「没听到说话」先停（end 的 reason 是 error）：也算桥通
      add('speechStop(在听)', s2.type === 'ok' && !!end && (end.reason === 'error' || ((J(s2.data) || {}).stopped === true && end.reason === 'stop' && end.fed === 3)),
        { stop: J(s2.data), end: end, n: events.length }, '送了 3 段静音：end 里 fed 是 3');
    } else add('speechStart(不弹框)', false, r, '没回');
    window.removeEventListener('echo-speech', onEv);
    R.speech = { state: st, start: j || r.type, events: events.length };
  }

  // ---------- run=store：问商品，有就开始买第一个（弹购买面板，不等结果） ----------
  async function store() {
    // 先来一个一定当场回的（不是 UUID）：异步桥一路通到 Store.swift 再回来
    var b0 = await nativeCall(function (id) { return N.iapBuy(id, 'com.echoisland.selftest', 'not-a-uuid'); });
    var plumbing = failed(b0, 'bad-token');
    add('store.bridge', plumbing, b0);
    var r = await nativeCall(function (id) { return N.iapProducts(id, ''); }, 20000);
    var j = J(r.data) || {};
    var list = Array.isArray(j.products) ? j.products : [];
    R.store = { plumbing: plumbing, answered: r.type === 'ok' || r.type === 'fail', type: r.type, count: list.length, ids: list.map(function (p) { return p.id; }), missing: j.missing || null, error: j.error || null };
    add('store.products', R.store.answered && list.length ? true : 'warn', R.store, list.length ? '' : R.store.answered ? '没有商品：云上的模拟器没有本地 App Store' : '20 秒没回：模拟器上 App Store 慢');
    if (!list.length) return;
    R.store.buyStarted = true;
    nativeCall(function (id) { return N.iapBuy(id, list[0].id, uuid()); }, 120000).then(function (b) { R.store.buy = { type: b.type, data: J(b.data) }; });
    add('store.buy', true, list[0].id, '购买面板应该弹出来（UI 测试看）');
  }

  // ---------- 七、要点界面的几样（UI 测试按启动参数分开跑，也可以手动按按钮） ----------
  async function mic() {
    var out = { before: N.micPermission() };
    try {
      var s = await navigator.mediaDevices.getUserMedia({ audio: true });
      out.ok = true; out.tracks = s.getAudioTracks().length;
      s.getTracks().forEach(function (t) { t.stop(); });
    } catch (e) { out.ok = false; out.error = (e && e.name) || String(e); }
    out.after = N.micPermission();
    R.mic = out;
    // 允许了以后 micPermission 一定是 granted；模拟器没有真麦克风时 getUserMedia 可能报 NotFoundError / NotReadableError（只记下来）
    add('mic.permission', out.after === 'granted' ? true : out.after === 'blocked' ? false : 'warn', out);
    add('mic.capture', out.ok ? true : 'warn', out.ok ? out.tracks + ' 条声音' : out.error, '模拟器有没有声音输入看云上的 Mac');
  }
  function share() { var r = N.shareFile('回声岛自测', 'echo-selftest.json', '{"selftest":1}'); R.ui.share = r; add('shareFile', r === true, r, '弹分享面板'); }
  function pick() {
    window.addEventListener('echo-backup-picked', function (e) { R.ui.picked = e.detail; add('echo-backup-picked', !!e.detail && typeof e.detail.ok === 'boolean', e.detail); }, { once: true });
    var r = N.backupPick(); R.ui.pick = r; add('backupPick', r === true, r, '弹文件选择器');
  }

  document.getElementById('b-mic').addEventListener('click', function () { mic(); });
  document.getElementById('b-share').addEventListener('click', share);
  document.getElementById('b-pick').addEventListener('click', pick);
  document.getElementById('b-settings').addEventListener('click', function () { add('openAppSettings', N.openAppSettings() === true, '去了「设置」'); });
  // 手动试的几个（会弹系统界面）：结果加在列表最后
  function manual(name, fn) { return function () { nativeCall(fn, 300000).then(function (r) { add(name, r.type === 'ok' ? true : 'warn', J(r.data) || r); }); }; }
  document.getElementById('b-products').addEventListener('click', manual('iapProducts(按钮)', function (id) { return N.iapProducts(id, ''); }));
  document.getElementById('b-restore').addEventListener('click', manual('iapRestore(按钮)', function (id) { return N.iapRestore(id); }));
  document.getElementById('b-manage').addEventListener('click', manual('iapManage(按钮)', function (id) { return N.iapManage(id); }));
  document.getElementById('b-apple').addEventListener('click', manual('appleSignIn(按钮)', function (id) { return N.appleSignIn(id, nonce()); }));
  // 原生发来的订阅事件（续费、退款、家长批准）：记下来
  window.addEventListener('echo-iap', function (e) { R.ui.iap = (R.ui.iap || []).concat([e.detail && { kind: e.detail.kind, productId: e.detail.productId }]); });

  (async function () {
    if (!N) { add('env.native', false, '没有 window.EchoNative'); finish(); return; }
    try {
      if (run === 'all') { await env(); await syncMethods(); await asyncMethods(); await account(); await speech(); await media(); }
      else if (run === 'store') await store();
      else if (run === 'packs') await packs();
      else if (run === 'packs2') await packs2();
      else if (run === 'mic') await mic();
      else if (run === 'share') share();
      else if (run === 'pick') pick();
      else add('run', false, run, '不认识的 run');
    } catch (e) { add('selftest', false, 'threw ' + (e && e.message)); }
    finish();
  })();
})();
